[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentra"
version = "0.1.0"
description = "WhatsApp-first fraud risk detector for proof-of-payment artifacts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.1.19",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "boto3>=1.34.0",
  "easyocr>=1.7.1",
  "Pillow>=10.4.0",
  "opencv-python-headless>=4.10.0.84",
  "PyMuPDF>=1.24.9",
  "numpy>=1.26.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
]

[tool.setuptools]
packages = [
  "app",
  "app.api",
  "app.api.routes",
  "app.core",
  "app.db",
  "app.integrations",
  "app.inference",
  "app.models",
  "app.schemas",
  "app.services",
  "app.workers",
  "ml",
  "ml.datasets",
  "ml.training",
  "ml.evaluation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
